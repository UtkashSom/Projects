<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Modify Parking Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h2>Modify Parking Lot Details</h2>

    <form method="post" class="mt-4">

        <div class="mb-3">
            <label for="prime_location_name" class="form-label">Location Name</label>
            <input type="text" id="prime_location_name" name="prime_location_name" value="{{ lot.prime_location_name }}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Full Address</label>
            <input type="text" id="address" name="address" value="{{ lot.address }}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="pin_code" class="form-label">Postal/Pin Code</label>
            <input type="text" id="pin_code" name="pin_code" value="{{ lot.pin_code }}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Hourly Rate (AED)</label>
            <input type="number" step="0.01" id="price" name="price" value="{{ lot.price }}" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary ms-2">← Return to Dashboard</a>
    </form>
</div>
</body>
</html>
