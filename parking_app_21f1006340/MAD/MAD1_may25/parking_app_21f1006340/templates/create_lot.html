<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add New Parking Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h2>Add Parking Lot</h2>
    <form method="post" class="mt-4">

        <div class="mb-3">
            <label for="prime_location_name" class="form-label">Location Name</label>
            <input type="text" id="prime_location_name" name="prime_location_name" class="form-control" placeholder="Enter location name" required />
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Hourly Price (AED)</label>
            <input type="number" id="price" name="price" step="0.01" class="form-control" placeholder="Set price per hour" required />
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address Details</label>
            <input type="text" id="address" name="address" class="form-control" placeholder="Enter address" required />
        </div>

        <div class="mb-3">
            <label for="pin_code" class="form-label">Postal Code</label>
            <input type="text" id="pin_code" name="pin_code" class="form-control" placeholder="Enter pin/postal code" required />
        </div>

        <div class="mb-3">
            <label for="maximum_number_of_spots" class="form-label">Maximum Number of Spots</label>
            <input type="number" id="maximum_number_of_spots" name="maximum_number_of_spots" class="form-control" placeholder="Total spots available" required />
        </div>

        <button type="submit" class="btn btn-primary">Add Lot</button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary ms-2">← Return to Dashboard</a>
    </form>
</div>
</body>
</html>
